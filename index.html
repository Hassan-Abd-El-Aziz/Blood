<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>فصائل دم قرية العامرية | كن سبباً في إحياء نفس</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- AOS Animation Library -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="transition-colors duration-300">
    <!-- Main Content -->
    <main id="mainContent">
      <!-- Hero Section - Full Screen -->
      <section
        class="hero-section relative h-screen flex items-center justify-center overflow-hidden"
      >
        <div class="absolute inset-0 hero-overlay"></div>
        <div
          class="relative z-10 text-center text-white px-4 max-w-7xl mx-auto flex flex-col justify-center gap-10 items-center"
        >
          <div data-aos="fade-left">
            <div class="mb-6">
              <i class="fas fa-heartbeat text-6xl mb-4 animate-pulse"></i>
            </div>
            <h1
              class="text-4xl md:text-6xl font-bold mb-4 typing-container leading-tight"
            >
              <span id="typedText" class="border-r-4 border-white"></span>
            </h1>
            <p
              class="text-xl md:text-2xl mt-6 bg-black/30 backdrop-blur-sm inline-block px-6 py-2 rounded-full"
            >
              انقذ حياة، تبرع بالدم
            </p>
          </div>
        </div>
        <div
          class="absolute bottom-10 left-1/2 transform -translate-x-1/2 animate-bounce"
        >
          <i class="fas fa-chevron-down text-white text-3xl"></i>
        </div>
      </section>

      <!-- Search Section -->
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div
          class="bg-white rounded-2xl shadow-xl p-6 mb-10 transform transition-all duration-500 hover:shadow-2xl"
          data-aos="fade-up"
        >
          <h2
            class="text-2xl font-bold text-gray-800 border-r-4 border-crimson pr-3 mb-6"
          >
            <i class="fas fa-search ml-2"></i>ابحث عن متبرع
          </h2>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="animate-slideIn" style="animation-delay: 0.1s">
              <label class="block text-sm font-semibold text-gray-600 mb-1">
                <i class="fas fa-user ml-1"></i>الاسم
              </label>
              <input
                type="text"
                id="searchName"
                placeholder="اكتب اسم المتبرع..."
                class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-crimson focus:border-transparent outline-none transition"
              />
            </div>
            <div class="animate-slideIn" style="animation-delay: 0.2s">
              <label class="block text-sm font-semibold text-gray-600 mb-1">
                <i class="fas fa-map-marker-alt ml-1"></i>المنطقة
              </label>
              <select
                id="searchArea"
                class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-crimson outline-none"
              >
                <option value="">جميع المناطق</option>
              </select>
            </div>
            <div class="animate-slideIn" style="animation-delay: 0.3s">
              <label class="block text-sm font-semibold text-gray-600 mb-1">
                <i class="fas fa-tint ml-1"></i>فصيلة الدم
              </label>
              <select
                id="searchBlood"
                class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-crimson outline-none"
              >
                <option value="">جميع الفصائل</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
            </div>
            <div
              class="flex items-end animate-slideIn"
              style="animation-delay: 0.4s"
            >
              <button
                id="resetFiltersBtn"
                class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-6 py-2.5 rounded-xl transition-all duration-300 w-full"
              >
                <i class="fas fa-undo-alt ml-1"></i>إعادة ضبط
              </button>
            </div>
          </div>
        </div>

        <!-- Cards Grid -->
        <div
          id="donorsGrid"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
          data-aos="fade-up"
        >
          <div class="loader"></div>
        </div>

        <!-- Empty State -->
        <div
          id="emptyMessage"
          class="hidden text-center py-12 bg-gray-50 rounded-2xl my-8 animate-fadeIn"
        >
          <i class="fas fa-search text-gray-400 text-6xl mb-4"></i>
          <p class="text-gray-500 text-lg">لا يوجد متبرعون مطابقون لبحثك</p>
        </div>
      </div>

      <!-- Quran Verse Section -->
      <div class="quran-section py-16 mt-12" data-aos="fade-up">
        <div class="max-w-4xl mx-auto text-center px-4">
          <div class="verse-card p-8 rounded-2xl bg-white/50 backdrop-blur-md">
            <p class="ayah-arabic text-3xl md:text-4xl font-bold mb-4">
              ﴿ وَمَنْ أَحْيَاهَا فَكَأَنَّمَا أَحْيَا النَّاسَ جَمِيعاً ﴾
            </p>
            <p class="text-gray-600 text-lg">صدق الله العظيم</p>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer class="bg-gray-900 text-white py-8">
        <div class="text-center">
          <p class="text-lg mb-2">
            <i class="fas fa-code ml-2"></i>
            بواسطة م/ حسن عبد العزيز
          </p>
          <p class="text-sm text-gray-400">
            <i class="fas fa-heart text-crimson ml-1"></i>
            كن سبباً في إحياء نفس
          </p>
        </div>
      </footer>
    </main>

    <!-- Floating Buttons -->
    <a
      href="https://wa.me/201234567890?text=السلام%20عليكم%20،%20أحتاج%20متبرع%20بالدم"
      target="_blank"
      class="fixed bottom-6 left-6 bg-green-500 text-white p-4 rounded-full shadow-lg z-50 floating-btn hover:bg-green-600 transition-all duration-300"
    >
      <i class="fab fa-whatsapp text-2xl"></i>
    </a>

    <button
      id="backToTopBtn"
      class="fixed bottom-24 left-6 bg-crimson text-white p-4 rounded-full shadow-lg z-50 floating-btn transition-all duration-300 opacity-0 invisible"
    >
      <i class="fas fa-arrow-up text-xl"></i>
    </button>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="donors-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
